<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aceite da OS · ZapClin</title>
<meta name="description" content="Confirme o aceite digital da sua ordem de serviço na ZapClin Higienização de Capacetes.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://ribocg-a11y.github.io/zapclin/aceite.html">
<meta property="og:title" content="Aceite da OS · ZapClin">
<meta property="og:description" content="Confira os dados do seu capacete e confirme o aceite digital.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ribocg-a11y.github.io/zapclin/aceite.html">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#07080d;--card:#12151f;--line:#2a3142;--text:#eef2ff;--muted:#9aa3bf;
    --cyan:#00d4ee;--green:#17d982;--red:#ff6b7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{width:min(560px,100%);margin:0 auto;padding:22px 18px 40px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  header img{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:#0a0f24}
  .brand{font-weight:800;font-size:18px;letter-spacing:.02em}
  .place{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  h1{margin:0 0 8px;color:var(--cyan);font-size:28px;line-height:1.15}
  .lead{color:var(--muted);line-height:1.45;margin:0 0 18px;font-size:15px}
  .box{border:1px solid var(--line);background:#0f1118;border-radius:16px;padding:14px;margin:12px 0}
  .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b90ad}
  .val{font-size:20px;font-weight:800;margin-top:4px}
  .svc{border-top:1px solid var(--line);padding:12px 0}
  .svc:first-child{border-top:0;padding-top:0}
  .svc strong{display:block;color:#7eb0ff;margin-bottom:4px;font-size:13px}
  .obs{color:var(--muted);margin-top:4px;font-size:14px}
  .terms{font-size:14px;color:#cbd5e1;line-height:1.5;background:rgba(0,215,245,.07);border:1px solid rgba(0,215,245,.2);border-radius:16px;padding:14px;margin:16px 0}
  button{width:100%;border:0;border-radius:16px;background:linear-gradient(180deg,#2ee59a,#17d982);color:#04120b;font-weight:900;font-size:18px;min-height:58px;padding:16px;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  .ok{background:rgba(23,217,130,.12);border:1px solid rgba(23,217,130,.28);border-radius:16px;padding:18px;color:#d9ffe9;font-weight:800;text-align:center}
  .err{background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.28);border-radius:16px;padding:16px;color:#ffd0d4}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px;line-height:1.4}
  footer{text-align:center;color:#68718e;font-size:12px;margin-top:28px;line-height:1.45}
  .sk{height:14px;border-radius:8px;background:linear-gradient(90deg,#1a1e2b,#252a3a,#1a1e2b);background-size:200% 100%;animation:sh 1.1s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <img src="icon-192.png" alt="ZapClin">
    <div>
      <div class="brand">ZapClin</div>
      <div class="place">Higienização de capacetes · Golden Shopping Calhau</div>
    </div>
  </header>
  <section class="card" id="app">
    <p class="lead">Carregando sua ordem de serviço…</p>
    <div class="box"><div class="sk"></div></div>
  </section>
  <footer>ZapClin · Av. dos Holandeses, 200 · Golden Shopping Calhau · São Luís, MA</footer>
</main>
<script>
(function(){
  var WEB_APP = 'https://script.google.com/macros/s/AKfycbx1MKIovW80bcjwRcqoGG88Oyh24N6UQdO9BjTcowMkq2iDLUiqhokUPQ2Hf_d5w_8yLg/exec';
  var app = document.getElementById('app');
  var os = parseInt((location.search.match(/[?&]os=([^&]*)/) || [])[1] || '0', 10) || 0;
  var busy = false;

  function esc(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function osFmt(n){ n = parseInt(n || 0, 10); return n ? '#' + String(n).padStart(6,'0') : '—'; }
  function brl(n){
    n = parseFloat(n || 0) || 0;
    return 'R$ ' + n.toFixed(2).replace('.', ',');
  }
  function telBR(tel){
    var d = String(tel || '').replace(/\D/g,'');
    if (d.indexOf('55') === 0 && d.length > 11) d = d.slice(2);
    if (d.length === 11) return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
    if (d.length === 10) return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
    return String(tel || '').trim() || 'Não informado';
  }
  function jsonp(action, params){
    params = params || {};
    return new Promise(function(resolve, reject){
      var cb = 'zcAceite_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
      var t = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 20000);
      function cleanup(){ clearTimeout(t); try { delete window[cb]; } catch(e){} if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(d){ cleanup(); resolve(d); };
      var qs = 'action=' + encodeURIComponent(action) + '&callback=' + cb + '&t=' + Date.now();
      Object.keys(params).forEach(function(k){
        if (params[k] !== undefined && params[k] !== null) qs += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      });
      var s = document.createElement('script');
      s.onerror = function(){ cleanup(); reject(new Error('rede')); };
      s.src = WEB_APP + '?' + qs;
      document.head.appendChild(s);
    });
  }
  function servicosHtml(d){
    var svcs = d.servicos || [];
    var obs = d.observacoes || [];
    var html = '';
    for (var i = 0; i < svcs.length; i++){
      if (!svcs[i]) continue;
      var o = obs[i];
      if (Array.isArray(o)) o = o.filter(Boolean).join(', ');
      html += '<div class="svc"><strong>Capacete ' + (i + 1) + '</strong><span>' + esc(svcs[i]) + '</span>' +
        (o ? '<div class="obs">Condições: ' + esc(o) + '</div>' : '') + '</div>';
    }
    return html || '<div class="svc">Serviço registrado na OS.</div>';
  }
  function showOk(d, ja){
    document.title = 'Aceite confirmado · ZapClin';
    app.innerHTML =
      '<h1>Aceite confirmado</h1>' +
      '<p class="lead">' + (ja ? 'Esta OS já estava confirmada.' : 'Registramos sua confirmação da ' + esc(osFmt(d && d.os || os)) + '.') + ' Obrigado pela confiança na ZapClin.</p>' +
      '<div class="ok">Tudo certo. Pode fechar esta página.</div>';
  }
  function showErr(msg){
    app.innerHTML = '<h1>Não foi possível abrir</h1><div class="err">' + esc(msg) + '</div><p class="hint">Peça à ZapClin para reenviar o link da sua OS.</p>';
  }
  function showForm(d){
    document.title = 'Aceite da OS ' + osFmt(d.os) + ' · ZapClin';
    var ja = String((d.aceite && d.aceite.status) || '').toUpperCase() === 'CONFIRMADO';
    if (ja){ showOk(d, true); return; }
    app.innerHTML =
      '<h1>Aceite da OS ' + esc(osFmt(d.os)) + '</h1>' +
      '<p class="lead">Confira os dados do recebimento do capacete. O aceite confirma ciência das condições e autoriza a execução do serviço.</p>' +
      '<div class="box"><div class="lbl">Cliente</div><div class="val">' + esc(d.nome) + '</div>' +
      '<div class="lead" style="margin:6px 0 0">' + esc(telBR(d.telefone)) + ' · ' + esc(d.data || '') + ' ' + esc(d.hora || '') + '</div></div>' +
      '<div class="box"><div class="lbl">Serviços registrados</div>' + servicosHtml(d) + '</div>' +
      '<div class="box"><div class="lbl">Total</div><div class="val">' + esc(brl(d.total)) + '</div></div>' +
      '<div class="terms">Ao tocar em aceitar, declaro que conferi as informações da OS, condições registradas e serviço contratado, autorizando a ZapClin a executar o atendimento conforme descrito.</div>' +
      '<button type="button" id="btnAceite">Aceito as condições da OS</button>' +
      '<p class="hint">ZapClin Higienização · São Luís, MA</p>';
    document.getElementById('btnAceite').onclick = function(){
      if (busy) return;
      busy = true;
      this.disabled = true;
      this.textContent = 'Confirmando…';
      jsonp('confirmarAceiteOs', { os: d.os }).then(function(r){
        if (r && r.ok && String(r.status).toUpperCase() === 'CONFIRMADO') showOk(r, !!r.jaConfirmado);
        else showErr((r && r.error) || 'Não consegui registrar o aceite. Tente de novo.');
      }).catch(function(){
        busy = false;
        var b = document.getElementById('btnAceite');
        if (b){ b.disabled = false; b.textContent = 'Aceito as condições da OS'; }
        showErr('Falha de conexão ao confirmar. Abra esta página no Chrome ou Safari e tente outra vez.');
      });
    };
  }

  if (!os){ showErr('Link incompleto: falta o número da OS.'); return; }
  jsonp('dadosAceiteOs', { os: os }).then(function(d){
    if (d && d.ok && d.os) showForm(d);
    else if (d && d.error) showErr(d.error === 'OS nao encontrada' ? 'OS não encontrada. Confira o link enviado pela ZapClin.' : d.error);
    else showErr('O servidor ainda não reconhece esta página. A ZapClin precisa publicar a versão nova do sistema.');
  }).catch(function(){
    showErr('Não consegui carregar a OS. Verifique a internet e abra o link novamente.');
  });
})();
</script>
</body>
</html>
